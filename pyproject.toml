[project]
name = "knowledgeagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.27.4",
    "fastapi>=0.115.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "markdown-it-py>=4.0.0",
    "minio>=7.2.20",
    "pymilvus>=3.0.1",
    "pymongo>=4.18.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "socksio>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "full_flow: accesses real MongoDB, MinIO, MinerU, Bailian and Zilliz services",
]
