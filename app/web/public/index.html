<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KnowledgeAgent 私有知识库问答">
  <title>KnowledgeAgent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">K</span><span>KnowledgeAgent</span></div>
      <button class="primary new-chat" id="new-chat" type="button"><span>＋</span> 新建对话</button>
      <div class="section-heading"><span>最近对话</span><button class="icon-button" id="refresh-conversations" title="刷新" aria-label="刷新会话">↻</button></div>
      <nav class="conversation-list" id="conversation-list" aria-label="会话列表"></nav>
      <div class="sidebar-footer">
        <div class="status-dot" id="service-dot"></div>
        <div><strong>知识库服务</strong><small id="service-label">正在连接</small></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" aria-label="打开侧栏">☰</button>
        <div><p class="eyebrow">KNOWLEDGE WORKSPACE</p><h1 id="conversation-title">与知识库对话</h1></div>
        <button class="library-button" id="library-button" type="button"><span>▱</span> 文档库 <b id="document-count">0</b></button>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <div class="orb"><span>✦</span></div>
          <p class="eyebrow">YOUR PRIVATE KNOWLEDGE</p>
          <h2>从你的文档中，找到答案。</h2>
          <p>上传 PDF、Word 或 Markdown 文档，我会基于原文为你检索、梳理并回答。</p>
          <div class="suggestions">
            <button type="button" data-prompt="请总结知识库中的核心内容">总结核心内容 <span>↗</span></button>
            <button type="button" data-prompt="这些文档有哪些关键结论？">提取关键结论 <span>↗</span></button>
            <button type="button" data-prompt="比较文档中的主要观点">比较主要观点 <span>↗</span></button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chat-form">
          <textarea id="message-input" rows="1" maxlength="8000" placeholder="向知识库提问…" aria-label="消息"></textarea>
          <div class="composer-actions">
            <button class="scope-button" id="scope-button" type="button"><span>◎</span><span id="scope-label">全部文档</span></button>
            <span class="shortcut">Enter 发送 · Shift + Enter 换行</span>
            <button class="send-button" id="send-button" type="submit" aria-label="发送" disabled>↑</button>
          </div>
        </form>
        <p class="disclaimer">回答由 AI 基于已入库文档生成，请核对原文引用。</p>
      </footer>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="library-drawer" aria-hidden="true">
    <header><div><p class="eyebrow">KNOWLEDGE BASE</p><h2>文档库</h2></div><button class="icon-button" id="close-library" aria-label="关闭">×</button></header>
    <label class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".pdf,.doc,.docx,.md,.markdown" multiple>
      <span class="upload-icon">↑</span>
      <strong>拖入文件或点击上传</strong>
      <small>支持 PDF、Word、Markdown</small>
    </label>
    <div class="upload-list" id="document-list"></div>
  </aside>

  <div class="scope-popover" id="scope-popover" hidden>
    <div class="scope-title">本次检索范围</div>
    <label><input type="checkbox" id="all-documents" checked> 全部已入库文档</label>
    <div id="scope-documents"></div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="assertive"></div>
  <script src="/app.js" defer></script>
</body>
</html>
